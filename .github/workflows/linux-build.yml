name: Build and Release (Linux)

on:
  push:
    branches: 
      - linux-release-not
    tags: [ "*" ]
    paths:
      - 'DocViewerDesktop/**'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:

      # 1) Checkout do repositório
      - name: Check out repository
        uses: actions/checkout@v4

      # 2) Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      # 3) Instalar dependências
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r DocViewerDesktop/requirements.txt
          pip install pyinstaller

      # 4) Build com PyInstaller
      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole --name DocViewer \
            --icon="resources/icons_svg/favicon.ico" \
            --add-data "DocViewerDesktop/ui/dark-high-v0.qss:ui" \
            --add-data "DocViewerDesktop/resources/icons_svg/*:resources/icons_svg" \
            --hidden-import="ui.ui_utils" \
            --hidden-import="editor.editor_core" \
            --hidden-import="editor.actions.file_actions" \
            --hidden-import="editor.actions.edit_actions" \
            --exclude-module PySide6.Qt3DCore \
            --exclude-module PySide6.Qt3DRender \
            --exclude-module PySide6.Qt3DExtras \
            --exclude-module PySide6.QtDataVisualization \
            --exclude-module PySide6.QtCharts \
            --exclude-module PySide6.QtWebEngineWidgets \
            --strip \
            DocViewerDesktop/main.py
          ls dist  

      # 5) Instalar FPM para criar .deb
      - name: Install FPM
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm

      # 6) Criar pacote .deb
      - name: Build .deb package
        run: |
          # Criar estrutura de diretórios do pacote
          mkdir -p package/usr/local/bin
          mkdir -p package/usr/share/applications
          mkdir -p package/usr/share/icons/hicolor/256x256/apps

          cp dist/DocViewer package/usr/local/bin/docviewer

          cp resources/icons_svg/favicon.png package/usr/share/icons/hicolor/256x256/apps/docviewer.png

          # Criar arquivo .desktop
          cat <<EOF > package/usr/share/applications/docviewer.desktop
          [Desktop Entry]
          Type=Application
          Name=DocViewer
          Comment=Visualizador de documentos
          Exec=/usr/local/bin/docviewer
          Icon=docviewer
          Terminal=false
          Categories=Utility;Office;
          StartupNotify=true
          EOF

          # Gerar .deb com FPM
          fpm -s dir -t deb \
            -n docviewer \
            -v 0.1.3 \
            --architecture amd64 \
            --description "DocViewer Desktop App" \
            --license "GNU General Public License v3.0" \
            --maintainer "Ernesto Alves <ernesto487dev@gmail.com>" \
            --url "https://github.com/${{ github.repository }}" \
            package/

          ls -lh


      # 7) Criar ou atualizar uma Release no GitHub
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v1.1.0-linux
          release_name: "Linux Release v1.1.0"
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 8) Fazer upload do .deb gerado na release
      - name: Upload .deb to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: docviewer_0.1.3_amd64.deb
          asset_name: "docviewer-linux.deb"
          asset_content_type: application/vnd.debian.binary-package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
